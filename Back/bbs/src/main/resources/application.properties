spring.application.name=bbs
server.port=${PORT:8080}
spring.profiles.default=sqlserver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
app.upload.dir=${UPLOAD_DIR:uploads/imagens}
app.upload.url-base=${UPLOAD_URL:/api/imagens}
app.admin.email=${BBS_ADMIN_EMAIL:admin@bbs.local}
app.admin.password=${BBS_ADMIN_PASSWORD:}
