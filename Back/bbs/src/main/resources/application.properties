spring.application.name=bbs
server.port=${PORT:8080}
spring.profiles.default=sqlserver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
app.upload.dir=${UPLOAD_DIR:uploads/imagens}
app.upload.url-base=${UPLOAD_URL:/api/imagens}
app.admin.email=${BBS_ADMIN_EMAIL:admin@bbs.local}
app.admin.password=${BBS_ADMIN_PASSWORD:}

# Tokens opacos: acesso 15 minutos; limite absoluto de renovação 8 horas.
app.auth.access-seconds=900
app.auth.refresh-seconds=28800
app.auth.cookie-secure=${BBS_COOKIE_SECURE:false}
server.servlet.session.cookie.secure=${BBS_COOKIE_SECURE:false}

# E-mail de recuperação: desativado até configurar um remetente autorizado.
app.recovery.enabled=${BBS_RECOVERY_ENABLED:false}
app.recovery.from=${BBS_MAIL_FROM:}
app.recovery.url=${BBS_PUBLIC_URL:http://localhost:5173/}
spring.mail.host=${BBS_SMTP_HOST:}
spring.mail.port=${BBS_SMTP_PORT:587}
spring.mail.username=${BBS_SMTP_USER:}
spring.mail.password=${BBS_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${BBS_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${BBS_SMTP_TLS:true}
spring.mail.properties.mail.smtp.starttls.required=${BBS_SMTP_TLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
