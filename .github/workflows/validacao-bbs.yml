name: Validacao BBS
on:
  push:
    branches: ["codex/bbs-completo"]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front/bbs-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Front/bbs-react/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back/bbs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: sh mvnw --batch-mode test
