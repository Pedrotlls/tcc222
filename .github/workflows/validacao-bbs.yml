name: Validacao BBS
on:
  push:
    branches: ["codex/bbs-completo"]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front/bbs-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Front/bbs-react/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back/bbs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: sh mvnw --batch-mode test
  sqlserver-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: BbsCi_Only_2026!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P BbsCi_Only_2026! -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      # Apenas credenciais fictícias do contêiner descartável. Não são da escola.
      DB_URL: jdbc:sqlserver://localhost:1433;databaseName=apibbs;encrypt=true;trustServerCertificate=true
      DB_USER: sa
      DB_PASSWORD: BbsCi_Only_2026!
      BBS_ADMIN_EMAIL: admin@ci.local
      BBS_ADMIN_PASSWORD: AdminCi_Only_2026!
      BBS_E2E: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Front/bbs-react/package-lock.json
      - name: Criar e atualizar esquema SQL Server
        env:
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          for script in database/01_criar_banco.sql database/03_atualizar_funcionalidades.sql database/04_enderecos_clientes.sql database/03_atualizar_funcionalidades.sql database/04_enderecos_clientes.sql; do
            docker exec -i "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$DB_PASSWORD" -C -b < "$script"
          done
      - run: sh mvnw --batch-mode package -DskipTests
        working-directory: Back/bbs
      - run: npm ci
        working-directory: Front/bbs-react
      - run: npm install --no-save --package-lock=false playwright@1.62.1
        working-directory: Front/bbs-react
      - run: npx playwright install --with-deps chromium
        working-directory: Front/bbs-react
      - name: Iniciar API SQL Server e frontend
        run: |
          mkdir -p Front/bbs-react/test-results
          java -jar Back/bbs/target/bbs-0.0.1-SNAPSHOT.jar > Front/bbs-react/test-results/api.log 2>&1 &
          echo $! > Front/bbs-react/test-results/api.pid
          npm --prefix Front/bbs-react run dev -- --host 127.0.0.1 > Front/bbs-react/test-results/vite.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/api/auth/session > /dev/null; then exit 0; fi
            sleep 2
          done
          cat Front/bbs-react/test-results/api.log
          exit 1
      - name: Testar desktop e mobile com API e banco reais
        run: node tests/full.e2e.cjs
        working-directory: Front/bbs-react
      - name: Repetir migração e reiniciar API preservando dados
        env:
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          kill "$(cat Front/bbs-react/test-results/api.pid)"
          for attempt in {1..30}; do
            if ! curl -fsS http://127.0.0.1:8080/auth/session > /dev/null; then break; fi
            sleep 1
          done
          docker exec -i "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$DB_PASSWORD" -C -b < database/03_atualizar_funcionalidades.sql
          docker exec -i "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$DB_PASSWORD" -C -b < database/04_enderecos_clientes.sql
          java -jar Back/bbs/target/bbs-0.0.1-SNAPSHOT.jar > Front/bbs-react/test-results/api-reinicio.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/api/auth/session > /dev/null; then exit 0; fi
            sleep 2
          done
          cat Front/bbs-react/test-results/api-reinicio.log
          exit 1
      - name: Conferir persistência após reinício
        run: node tests/full.e2e.cjs --verify
        working-directory: Front/bbs-react
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bbs-desktop-mobile-sqlserver
          path: Front/bbs-react/test-results/
          retention-days: 14
